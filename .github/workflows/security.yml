name: Security

on:
  pull_request:
  push:
    branches: [main]
  # New vulnerabilities are published without any code change, so also scan weekly.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          # "actions" scans the workflow files themselves.
          languages: javascript-typescript, actions
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Fails on high and critical only. Lower severities are tracked by Dependabot alerts.
      - run: bun audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comments need pull-requests: write. The failed check is enough.
          GITLEAKS_ENABLE_COMMENTS: false
