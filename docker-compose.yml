services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: sava_drilling
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Bound to 5433, not 5432: another local project already uses 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sava_drilling"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
