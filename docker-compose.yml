x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: sava_drilling
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Bound to 5433, not 5432: another local project already uses 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sava_drilling"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *logging

volumes:
  postgres-data:
